[project]
name = "jobradar"
version = "1.2.0"
description = "Job search for Switzerland: scores postings against your CV and career identity instead of relying on noisy keyword alerts, then drafts the application."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # >=0.109.2: the CI workflows authenticate by workload identity
    # federation, which needs the SDK's ANTHROPIC_FEDERATION_RULE_ID /
    # ANTHROPIC_IDENTITY_TOKEN_FILE credential provider.
    "anthropic>=0.109.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
