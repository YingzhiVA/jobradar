[project]
name = "jobradar"
version = "1.41.0"
description = "Job search for Switzerland: scores postings against your CV and career identity instead of relying on noisy keyword alerts, then drafts the application."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # >=0.109.2: the CI workflows authenticate by workload identity
    # federation, which needs the SDK's ANTHROPIC_FEDERATION_RULE_ID /
    # ANTHROPIC_IDENTITY_TOKEN_FILE credential provider.
    "anthropic>=0.109.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "markdown>=3.6",
]

[project.optional-dependencies]
# For `pip install -e ".[dev]"`. uv reads the group below instead.
dev = [
    "pytest>=8.0",
]

[dependency-groups]
# Installed by `uv sync` and `uv run` by default, so `uv run pytest` works.
dev = [
    "pytest>=8.0",
]

[build-system]
# >=77: the SPDX `license = "MIT"` form above.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The browser interface's page: HTML, CSS and JavaScript served as they are.
"jobradar.ui" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
