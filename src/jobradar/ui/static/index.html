<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="{{token}}">
<title>jobradar</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">

<script src="/static/app.js"></script>

</html>
