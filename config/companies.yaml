# The company career pages to scan, one board per entry.
#
# NOTHING IS SCANNED UNTIL YOU CHOOSE. Every entry below ships commented out.
# To switch a board on, remove the "# " at the start of ALL THREE of its lines
# (name, ats, slug) — then check your edit with `python -m jobradar.doctor`.
# Uncommenting only some of an entry's lines silently hands them to the entry
# above it, which is then scanned from the wrong board; the doctor catches that.
#
# START WITH A HANDFUL. Your first run treats every open posting on every board
# you switched on as new, and scores all of those that pass your constraints:
# a first run over many boards costs many times a normal day. Later runs only
# see what is new since the day before. Add boards a few at a time and each
# addition costs one such catch-up on its own. docs/COSTS.md has the numbers.
#
# What is here is one person's Swiss watchlist, kept because each board's
# quirks are written down next to it. It is grouped by industry below, so
# go straight to the sections in your field; a company that could sit in
# two appears once, so search for its name if it's not where you expect.
# Add your own with the formats below. There is deliberately no keyword
# list: what to surface is decided by scoring against your profile, not by
# job titles.
#
# Sections, in this order (boards in each):
#   Big tech & AI labs (5) — global names with Swiss offices, mostly Zurich
#   AI & data products (9) — Swiss start-ups and scale-ups selling AI or data
#   Software, SaaS & telecom (6)
#   Consulting & IT services (8)
#   Banking, insurance & finance data (6)
#   Pharma & biotech (5)
#   Medtech & digital health (7)
#   Robotics, drones & aerospace (6)
#   Industry, hardware & quantum (5)
#   Property & climate (6)
#   Consumer, marketplaces & travel (3)
#   Job intermediaries (1) — not employers; read the note before switching on
#
# Each entry has three fields:
#   name: how the company appears in reports
#   ats:  greenhouse | lever | ashby | smartrecruiters | personio | recruitee |
#         workable | teamtailor | workday | join | bamboohr | avature |
#         successfactors | icims | brassring | prospective | google
#   slug: the board token used in that ATS's public job-board URL, e.g.
#     greenhouse: https://boards-api.greenhouse.io/v1/boards/<slug>/jobs
#     lever:      https://api.lever.co/v0/postings/<slug>
#     ashby:      https://api.ashbyhq.com/posting-api/job-board/<slug>
#     bamboohr:   https://<slug>.bamboohr.com/careers/list  (slug = careers subdomain)
# You can usually find the slug in the company's own "Careers" page URL, or by
# viewing the page source for a link to boards.greenhouse.io / jobs.lever.co /
# jobs.ashbyhq.com. `python -m jobradar.discovery.discover` guesses slugs for
# the simple ATSs; the ones below need a manual read of the careers URL.
#
# Workday needs THREE coordinates, so its slug is "tenant:host:site" (e.g.
# "novartis:wd3:Novartis_Careers"), read from the company's
# *.myworkdayjobs.com careers URL — tenant + datacenter host (wd1/wd3/wd5/
# wd103/wd502) + site id. The site id has no naming convention, so open the
# careers page and read it off the URL. The connector pre-filters to Swiss
# postings server-side (Workday boards are global and large). An optional 4th
# slug segment pipe-separates location-facet descriptors to scope to instead
# ("roche:wd3:roche-ext:Basel|Kaiseraugst") — needed for a board whose
# location facet has no country in it, and it OVERRIDES the Swiss pre-filter,
# so the names you list are the only places fetched. A big enterprise fronting
# Workday with a custom portal (Roche and Johnson & Johnson use Phenom)
# usually still has the Workday board open underneath — read the tenant off
# the "Apply" link in a job page's HTML. Companies with no Workday board at
# all are reached by web_search, unless another connector covers them.
#
# avature and successfactors are hand-configured like Workday (their slugs
# aren't guessable single tokens):
#   avature:        slug is "host:portalPath:searchPathSegment", read from the
#                   company's careers URL, e.g.
#                   "jobs.siemens.com:en_US/externaljobs:Switzerland||". The
#                   third part scopes the listing server-side (Avature's
#                   term/facet path segment; trailing "||" included) — leave it
#                   empty for a board that's already single-country.
#   successfactors: slug is the search page's "host[/site]" prefix, e.g.
#                   "careers.ey.com/ey" or "careers.swissre.com" (job search
#                   lives at https://<slug>/search/). The connector bakes in
#                   locationsearch=Switzerland.
#   icims:          slug is the Jibe careers host, e.g. "careers.axa.com" (the
#                   JSON listing lives at https://<slug>/api/jobs, descriptions
#                   included, so no detail calls). The connector bakes in the
#                   country=Switzerland facet.
#   brassring:      slug is "host:partnerid:siteid[:Option1|Option2]", read off
#                   the Talent Gateway URL (jobs.ubs.com/TGnewUI/Search/home/
#                   HomeWithPreLoad?partnerid=25008&siteid=5012). The optional
#                   4th segment names facet options (a City, a division) to
#                   scope the board to server-side; without it a board over 100
#                   postings is refused, since every posting costs a ~0.4 MB
#                   detail page. One tenant runs several site ids (UBS:
#                   professionals / students / apprentices, each in four UI
#                   languages that share the same reqs) — pick the one the
#                   careers page links to for the audience you want.
#   prospective:    slug is the Prospective career-center id, optionally with a
#                   UI language ("1000982" or "1000982:de"). Read it off the
#                   employer's careers page source: it calls
#                   ohws.prospective.ch/public/v1/careercenter/<id>/ itself for
#                   its per-country job counts. Job pages live on the
#                   employer's own jobs.* domain and carry JSON-LD.
#   google:         reads the job feed Google publishes for aggregators (one
#                   ~20 MB download, descriptions included, kept to Swiss
#                   roles in code). The slug names the feed's employers to
#                   keep: "Google|YouTube|DeepMind" for all three.
#
# join is the one to be careful with: join.com serves a company PROFILE page
# for firms that were never its customers (Swisscom has one, with no ads,
# while its real board is Workday), and discovery only accepts a join board
# that has at least one live ad. So: only add a join entry when the company
# genuinely has ads there.

