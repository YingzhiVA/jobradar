# The company job boards to scan: your selection from config/boards.yaml.
#
# NOTHING IS SCANNED UNTIL YOU CHOOSE. Add one line per board, with the
# company's name as config/boards.yaml spells it (case doesn't matter):
#
#   companies:
#     - Frontify
#     - Verity
#
# Then check your edit with `python -m jobradar.doctor`.
#
# START WITH A HANDFUL. Your first run treats every open posting on every board
# you selected as new, and scores all of those that pass your constraints:
# a first run over many boards costs many times a normal day. Later runs only
# see what is new since the day before. Add boards a few at a time and each
# addition costs one such catch-up on its own. docs/COSTS.md has the numbers.
#
# A BOARD THE SHARED LIST LACKS: give its ats and slug yourself.
# config/boards.yaml explains how to read both off a careers page.
#
#     - name: Acme
#       ats: greenhouse
#       slug: acme
#
# The same form for a company the shared list has scans your board instead,
# and the doctor warns while the two differ. Leave ats and slug out to follow
# the shared list, which is fixed upstream when a company changes job boards.

companies:
